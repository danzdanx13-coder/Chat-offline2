<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chat Offline</title>
<style>
:root{--bg:#f0f2f5;--panel:#fff;--text:#111b21;--sub:#667781;--green:#008069;--out:#d9fdd3;--in:#fff;--chat:#efeae2;--line:#e9edef;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
input,select,textarea{font:inherit;color:var(--text)}
svg{display:block}
.app{height:100%;max-width:520px;margin:0 auto;background:var(--panel);position:relative;overflow:hidden}
.view{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--panel);transition:transform .22s}
#chat{transform:translateX(100%);background:var(--chat)}
.open #chat{transform:none}
.top{background:var(--green);color:#fff;padding:10px 12px;display:flex;align-items:center;gap:8px;min-height:56px}
.top h1{font-size:20px;font-weight:600;flex:1}
.ico{padding:6px;color:#fff;border-radius:50%}
.tabs{display:flex;background:var(--green)}.tabs button{flex:1;padding:10px;color:#fff;opacity:.7;font-weight:600;border-bottom:3px solid transparent}.tabs button.on{opacity:1;border-color:#fff}
.search{padding:8px 12px}.search input{width:100%;padding:9px 14px;border-radius:20px;border:0;background:var(--bg)}
.list{flex:1;overflow-y:auto}
.item{display:flex;gap:12px;padding:10px 14px;width:100%;text-align:left;align-items:center}
.item:active{background:var(--bg)}
.av{border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:600;flex:none;overflow:hidden}.av img{width:100%;height:100%;object-fit:cover}
.meta{flex:1;min-width:0;border-bottom:1px solid var(--line);padding-bottom:10px}
.row{display:flex;justify-content:space-between;gap:8px}
.name{font-weight:600;display:flex;align-items:center;gap:4px}
.time{font-size:12px;color:var(--sub)}
.last{color:var(--sub);font-size:14px;display:flex;align-items:center;gap:4px}.last span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.cnt{background:var(--green);color:#fff;border-radius:10px;min-width:20px;padding:0 6px;font-size:12px;text-align:center;flex:none}
.empty,.note{text-align:center;color:var(--sub);padding:40px 24px;font-size:14px}
.fab{position:absolute;right:18px;bottom:calc(24px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:16px;background:var(--green);color:#fff;display:grid;place-items:center;box-shadow:0 3px 10px rgba(0,0,0,.3)}
.ring{padding:2px;border-radius:50%;border:2.5px solid var(--green)}
.lt{padding:8px 14px;color:var(--green);font-weight:600;font-size:13px}
.tt{flex:1;min-width:0;cursor:pointer}.tt h1{font-size:17px;display:flex;align-items:center;gap:5px}.tt .time{color:#fff;opacity:.85}
.msgs{flex:1;overflow-y:auto;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.b{max-width:82%;padding:6px 9px 4px;border-radius:9px;background:var(--in);word-wrap:break-word;white-space:pre-wrap;box-shadow:0 1px 1px rgba(0,0,0,.12);-webkit-user-select:none;user-select:none}
.b.me{align-self:flex-end;background:var(--out)}.b.sel{outline:2px solid var(--green);filter:brightness(.9)}
.b small{display:flex;justify-content:flex-end;align-items:center;gap:3px;font-size:11px;color:var(--sub);margin-top:2px}
.b audio{height:38px;max-width:100%;display:block}.pic{display:block;max-width:100%;max-height:260px;border-radius:7px;margin-bottom:3px;cursor:pointer}
.day{align-self:center;background:var(--in);color:var(--sub);font-size:12px;padding:3px 10px;border-radius:8px;margin:6px 0}
.bar,#rec{display:flex;gap:8px;padding:8px;align-items:center}
.bar input{flex:1;padding:11px 16px;border-radius:24px;border:0;background:var(--panel)}
.send{width:44px;height:44px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;flex:none}
#rec{display:none}#rec b{flex:1;color:#e53935}
.selb{position:absolute;top:0;left:0;right:0;display:none;z-index:2}.selb.on{display:flex}.selb h1{flex:none!important;margin-right:auto}
.modal{position:absolute;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;padding:20px;z-index:5}.modal.on{display:flex}
.card{background:var(--panel);border-radius:14px;padding:18px;width:100%;max-height:88%;overflow-y:auto}.card h2{font-size:17px;margin-bottom:8px}
.card input[type=text],.card input[type=tel],.card input[type=password],.card select{width:100%;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--bg)}
label{display:block;font-size:12px;color:var(--sub);margin:10px 0 3px}
.acts{display:flex;justify-content:flex-end;gap:18px;margin-top:14px;color:var(--green);font-weight:600}
.lnk{color:var(--green);font-weight:600;padding:8px 0;display:block}
.err{color:#e53935;font-size:13px;min-height:18px;margin-top:6px}
.pc{display:flex;justify-content:center;margin:6px 0;position:relative}
.mrow{display:flex;gap:10px;align-items:center;padding:7px 0;width:100%;text-align:left}.mrow .name{flex:1}
.sw{display:flex;gap:10px;margin-top:8px}.sw button{width:30px;height:30px;border-radius:50%}
.stp{border-radius:12px;padding:14px;margin:8px 0}.stp textarea{width:100%;min-height:110px;background:none;border:0;outline:0;color:#fff;font-weight:600;font-size:20px;font-family:inherit;text-align:center;resize:none}
#vw{position:absolute;inset:0;z-index:12;display:none;align-items:center;justify-content:center;color:#fff}#vw.on{display:flex}#vw>img{max-width:100%;max-height:100%}
.pg{position:absolute;top:10px;left:10px;right:10px;display:flex;gap:4px}.pg i{flex:1;height:3px;background:rgba(255,255,255,.35);border-radius:2px;overflow:hidden}.pg i.d{background:#fff}.pg i.a::after{content:"";display:block;height:100%;background:#fff;animation:fl 5s linear forwards}@keyframes fl{from{width:0}to{width:100%}}
.vh{position:absolute;top:24px;left:12px;display:flex;gap:10px;align-items:center}
.vt{font-weight:600;font-size:24px;text-align:center;padding:30px;white-space:pre-wrap}.vc{position:absolute;bottom:30px;left:0;right:0;text-align:center;padding:0 20px;text-shadow:0 1px 3px #000}
#boot{position:absolute;inset:0;z-index:20;background:var(--panel);display:flex;align-items:center;justify-content:center;padding:24px}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#323232;color:#fff;padding:8px 14px;border-radius:18px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50;max-width:85%;text-align:center}#toast.on{opacity:1}
</style>
</head>
<body>
<div class="app" id="app">
  <section class="view" id="home">
    <div class="top"><h1>Chat Offline</h1><button class="ico" data-a="prof" id="bprof" aria-label="Profil"></button></div>
    <div class="tabs"><button class="on" data-a="tab" data-t="c">Chat</button><button data-a="tab" data-t="s">Status</button></div>
    <div class="search" id="sbar"><input id="q" placeholder="Cari nama atau nomor…" autocomplete="off"></div>

    <div class="top"><button class="ico" data-a="back" id="bback" aria-label="Kembali"></button><div id="cav" data-a="info"></div><div class="tt" data-a="info"><h1 id="cname"></h1><div class="time" id="csub"></div></div></div>
    <div class="msgs" id="msgs"></div>
    <div class="bar" id="bar"><button class="ico" data-a="att" id="batt" style="color:var(--sub)" aria-label="Kirim foto"></button><input type="file" id="fp" accept="image/*" hidden><input id="txt" placeholder="Ketik pesan" autocomplete="off"><button class="send" id="sv" data-a="sv" aria-label="Kirim"></button></div>
    <div id="rec"><button class="ico" data-a="rc" id="brc" style="color:var(--sub)" aria-label="Batal"></button><b id="rt">0:00</b><button class="send" data-a="rs" id="brs" aria-label="Kirim suara"></button></div>
  </section>
  <div class="modal" id="m"><div class="card" id="mc"></div></div>
  <div id="vw"></div>
  <div id="boot"><div class="note" id="bootc">Menghubungkan…</div></div>
</div>
<div id="toast"></div>
<input type="file" id="fs" accept="image/*" hidden>

/* ===== Lapisan database (Supabase) ===== */
function mkDB(url,key){
  var sb=window.supabase.createClient(url,key);
  var R=function(p){return p.then(function(r){if(r.error)throw r.error;return r.data})};
  return{
    uid:function(){return sb.auth.getSession().then(function(r){var s=r.data.session;if(s)return s.user.id;return sb.auth.signInAnonymously().then(function(x){if(x.error)throw x.error;return x.data.session.user.id})})},
    me:function(id){return R(sb.from('profiles').select('*').eq('id',id).maybeSingle())},
    reg:function(id,phone,name){return R(sb.from('profiles').insert({id:id,phone:phone,name:name}))},
    upd:function(id,patch){return R(sb.from('profiles').update(patch).eq('id',id))},
    byPhone:function(p){return R(sb.from('profiles').select('*').eq('phone',p).maybeSingle())},
    profs:function(ids){return R(sb.from('profiles').select('*').in('id',ids))},
    msgs:function(id){return R(sb.from('messages').select('*').or('sender_id.eq.'+id+',recipient_id.eq.'+id).order('created_at').limit(1500))},
    send:function(m){return R(sb.from('messages').insert(m).select().single())},
    ack:function(ids){var ps=[];for(var i=0;i<ids.length;i+=50)ps.push(R(sb.from('messages').update({status:2}).in('id',ids.slice(i,i+50))));return Promise.all(ps)},
    sts:function(){return R(sb.from('statuses').select('*').gt('created_at',new Date(Date.now()-864e5).toISOString()).order('created_at'))},
    post:function(s){return R(sb.from('statuses').insert(s).select().single())},
    sub:function(id,h){return sb.channel('co-'+id)
      .on('postgres_changes',{event:'INSERT',schema:'public',table:'messages',filter:'recipient_id=eq.'+id},function(p){h.inMsg(p.new)})
      .on('postgres_changes',{event:'UPDATE',schema:'public',table:'messages',filter:'sender_id=eq.'+id},function(p){h.updMsg(p.new)})
      .on('postgres_changes',{event:'*',schema:'public',table:'profiles'},function(p){if(p.new&&p.new.id)h.prof(p.new)})
      .on('postgres_changes',{event:'INSERT',schema:'public',table:'statuses'},function(p){h.st(p.new)})
      .subscribe(function(s){if(s==='SUBSCRIBED')h.ready()})}
  };

function hdr(){var p=S.pf[S.cur]||{name:'?'};$('cname').innerHTML=esc(p.name)+vb(p);$('cav').innerHTML=av(p,38);$('csub').textContent=p.phone?'+'+p.phone:''}
function setSv(){$('sv').innerHTML=ic($('txt').value.trim()?'send':'mic')}
function renderSt(){var by={};S.sts.forEach(function(s){(by[s.owner_id]=by[s.owner_id]||[]).push(s)});var mine=by[S.uid]||[],h='<button class="item" data-a="'+(mine.length?'vst':'newst')+'" data-id="'+S.uid+'"><div class="'+(mine.length?'ring':'')+'">'+av(S.me,mine.length?42:46)+'</div><div class="meta"><div class="name">Status saya'+vb(S.me)+'</div><div class="last"><span>'+(mine.length?mine.length+' status \u00b7 '+hm(mine[mine.length-1].created_at):'Ketuk untuk menambah status')+'</span></div></div></button>';
  var o=Object.keys(by).filter(function(k){return k!==S.uid}).sort(function(a,b){return Date.parse(by[b][by[b].length-1].created_at)-Date.parse(by[a][by[a].length-1].created_at)});
  if(o.length)h+='<div class="lt">Pembaruan terbaru</div>'+o.map(function(k){var p=S.pf[k]||{name:'?'};return '<button class="item" data-a="vst" data-id="'+k+'"><div class="ring">'+av(p,42)+'</div><div class="meta"><div class="name">'+esc(p.name)+vb(p)+'</div><div class="last"><span>'+hm(by[k][by[k].length-1].created_at)+'</span></div></div></button>'}).join('');
  $('stl').innerHTML=h+'<div class="note">Status hilang otomatis setelah 24 jam.</div>'}
function renderAll(){renderList();if(S.cur){hdr();renderMsgs()}if(S.tab==='s')renderSt()}

/* ===== Data ===== */
function need(ids){ids=ids.filter(function(i,k){return i&&!S.pf[i]&&ids.indexOf(i)===k});return ids.length?DB.profs(ids).then(function(r){r.forEach(function(p){S.pf[p.id]=p})}):Promise.resolve()}
function ackAll(){var ids=S.msgs.filter(function(m){return m.recipient_id===S.uid&&m.status<2}).map(function(m){return m.id});if(!ids.length)return Promise.resolve();ids.forEach(function(i){S.msgs.forEach(function(m){if(m.id===i)m.status=2})});return DB.ack(ids).catch(function(){})}
function reload(){return DB.msgs(S.uid).then(function(r){S.msgs=r;return DB.sts()}).then(function(r){S.sts=r;return need(S.msgs.map(peerOf).concat(S.sts.map(function(s){return s.owner_id})))}).then(ackAll).then(renderAll).catch(function(e){toast('Gagal memuat data: '+(e.message||e))})}
function onIn(m){if(S.msgs.some(function(x){return x.id===m.id}))return;S.msgs.push(m);need([m.sender_id]).then(function(){ackAll();if(S.cur===m.sender_id){S.read[S.cur]=Date.now();saveLoc()}else toast('Pesan baru dari '+((S.pf[m.sender_id]||{}).name||'?'));renderAll()})}
function onUpd(m){S.msgs.forEach(function(x){if(x.id===m.id)x.status=m.status});renderAll()}
function onProf(p){S.pf[p.id]=p;if(p.id===S.uid)S.me=p;renderAll()}
function onSt(s){if(!S.sts.some(function(x){return x.id===s.id})){S.sts.push(s);need([s.owner_id]).then(function(){if(S.tab==='s')renderSt()})}}

/* ===== Mulai / daftar ===== */
function fatal(t){$('boot').style.display='flex';$('bootc').innerHTML=t}
function setup(){$('bootc').innerHTML='<div class="card" style="box-shadow:0 1px 8px rgba(0,0,0,.15)"><h2>Sambungkan Supabase</h2><p class="time">Salin dari Supabase: Project Settings, API. Untuk publik, isi dua nilai itu di bagian PENGATURAN pada file ini.</p><label>Project URL</label><input type="text" id="su" placeholder="https://xxxx.supabase.co" autocomplete="off"><label>Anon public key</label><input type="password" id="sk" autocomplete="off"><div class="acts"><button data-a="ssave">Simpan</button></div></div>'}
function boot(){var url=CFG.url||localStorage.getItem('co-url'),key=CFG.key||localStorage.getItem('co-key');
  if(!url||!key){setup();return}
  if(!window.__DB&&!window.supabase){fatal('Library Supabase gagal dimuat. Periksa koneksi internet lalu muat ulang.');return}
  DB=window.__DB||mkDB(url,key);
  DB.uid().then(function(id){S.uid=id;return DB.me(id)}).then(function(me){if(me){S.me=me;start()}else regM()}).catch(function(e){fatal('Tidak bisa terhubung ke Supabase: '+esc(e.message||e)+'<br><br>Pastikan Anonymous sign-ins sudah aktif dan skema SQL sudah dijalankan.')})}
function regM(){$('boot').style.display='none';modal('<h2>Daftar</h2><p class="time">Masukkan nama dan nomor HP kamu untuk mulai chat dengan siapa saja.</p><label>Nama</label><input type="text" id="rn" maxlength="25" autocomplete="off"><label>Negara</label><select id="rcc">'+ccOpts('62')+'</select><label>Nomor HP</label><input type="tel" id="rp" maxlength="14" placeholder="Nomor tanpa kode negara" autocomplete="off"><div class="err" id="rerr"></div><div class="acts"><button data-a="rdaf">Daftar</button></div>')}
function start(){S.pf[S.me.id]=S.me;$('boot').style.display='none';closeM();setSv();
  DB.sub(S.uid,{inMsg:onIn,updMsg:onUpd,prof:onProf,st:onSt,ready:reload});reload();
  document.addEventListener('visibilitychange',function(){if(!document.hidden)reload()})}

/* ===== Aksi ===== */
var A={},rec=null,chunks=[],rt0=0,rti=0,lpT=0,lpF=0,vq=[],vi=0,vt=0,vo=null,stBg='#008069',BGS=['#008069','#8e44ad','#2980b9','#c0392b','#e67e22','#2c3e50'];
A.ssave=function(){var u=$('su').value.trim(),k=$('sk').value.trim();if(!/^https:\/\/.+/.test(u)||k.length<20)return toast('Isi Project URL dan anon key dengan benar.');try{localStorage.setItem('co-url',u);localStorage.setItem('co-key',k)}catch(e){}location.reload()};
A.rdaf=function(){var n=$('rn').value.trim(),cc=$('rcc').value,p=fullNum(cc,$('rp').value);if(!n)return $('rerr').textContent='Nama wajib diisi.';if(!p)return $('rerr').textContent='Nomor tidak valid untuk kode negara +'+cc+'.';
  DB.reg(S.uid,p,n).then(function(){S.me={id:S.uid,phone:p,name:n,bio:'Halo! Saya pakai Chat Offline.',photo:''};start()}).catch(function(e){$('rerr').textContent=e&&e.code==='23505'?'Nomor ini sudah dipakai pengguna lain.':'Gagal mendaftar: '+(e.message||e)})};
A.x=closeM;
A.tab=function(a){S.tab=a.dataset.t;document.querySelectorAll('.tabs button').forEach(function(b){b.classList.toggle('on',b===a)});$('list').style.display=S.tab==='c'?'':'none';$('stl').style.display=S.tab==='s'?'block':'none';$('sbar').style.display=S.tab==='c'?'':'none';$('fab').dataset.a=S.tab==='c'?'newc':'newst';$('fab').innerHTML=ic(S.tab==='c'?'plus':'cam');if(S.tab==='s')renderSt()};
A.newc=function(){modal('<h2>Chat baru</h2><label>Negara</label><select id="ncc">'+ccOpts('62')+'</select><label>Nomor HP teman</label><input type="tel" id="nph" maxlength="14" placeholder="Nomor tanpa kode negara" autocomplete="off"><div class="err" id="nerr"></div><div class="acts"><button data-a="x">Batal</button><button data-a="nstart">Mulai chat</button></div>')};
A.nstart=function(){var cc=$('ncc').value,p=fullNum(cc,$('nph').value);if(!p)return $('nerr').textContent='Nomor tidak valid untuk kode negara +'+cc+'.';if(p===S.me.phone)return $('nerr').textContent='Itu nomormu sendiri.';
  DB.byPhone(p).then(function(r){if(!r)return $('nerr').textContent='Nomor +'+p+' belum terdaftar di Chat Offline. Ajak temanmu mendaftar dulu.';S.pf[r.id]=r;closeM();openChat(r.id)}).catch(function(e){$('nerr').textContent='Gagal mencari nomor: '+(e.message||e)})};
function openChat(id){S.cur=id;S.sel=[];$('selb').classList.remove('on');S.read[id]=Date.now();saveLoc();hdr();renderMsgs();$('app').classList.add('open');setSv();renderList()}
A.open=function(a){openChat(a.dataset.id)};
A.back=function(){$('app').classList.remove('open');S.cur=null;S.sel=[];renderList()};
function sendMsg(x){if(!S.cur)return;var m={sender_id:S.uid,recipient_id:S.cur,body:x.body||'',img:x.img||'',audio:x.audio||'',dur:x.dur||0},t=Object.assign({},m,{id:'t'+Date.now(),status:1,created_at:new Date().toISOString()});S.msgs.push(t);renderMsgs();renderList();
  DB.send(m).then(function(r){Object.assign(t,r)}).catch(function(e){S.msgs=S.msgs.filter(function(z){return z!==t});renderMsgs();renderList();toast('Pesan gagal terkirim: '+(e.message||e))})}
function sendT(){var v=$('txt').value.trim();if(!v)return;sendMsg({body:v});$('txt').value='';setSv()}
A.sv=function(){if($('txt').value.trim())sendT();else recStart()};
function recStart(){if(!navigator.mediaDevices||!window.MediaRecorder)return toast('Perangkat tidak mendukung rekam suara.');
  navigator.mediaDevices.getUserMedia({audio:true}).then(function(s){rec=new MediaRecorder(s);rec._s=s;chunks=[];rec.ondataavailable=function(e){chunks.push(e.data)};rec.start();rt0=Date.now();$('bar').style.display='none';$('rec').style.display='flex';$('rt').textContent='0:00';rti=setInterval(function(){var d=(Date.now()-rt0)/1000;$('rt').textContent=fmt(d);if(d>=90)A.rs()},500)}).catch(function(){toast('Izinkan akses mikrofon untuk voice note.')})}
function recStop(ok){if(!rec)return;var m=rec,d=Math.round((Date.now()-rt0)/1000);rec=null;clearInterval(rti);m.onstop=function(){m._s.getTracks().forEach(function(t){t.stop()});if(ok&&d>0){var r=new FileReader();r.onload=function(){if(r.result.length>880000)toast('Voice note terlalu panjang.');else sendMsg({audio:r.result,dur:d})};r.readAsDataURL(new Blob(chunks,{type:m.mimeType}))}};m.stop();$('rec').style.display='none';$('bar').style.display='flex'}
A.rc=function(){recStop(0)};A.rs=function(){recStop(1)};
A.att=function(){$('fp').click()};
document.addEventListener('change',function(e){var t=e.target,f=t.files&&t.files[0];if(!f)return;if(t.id==='fp'){t.value='';shrink(f,900,0,function(d){if(d.length>680000)return toast('Foto terlalu besar.');S.pimg=d;modal('<h2>Kirim foto</h2><div class="pc"><img src="'+d+'" alt="" style="max-width:100%;max-height:45vh;border-radius:8px"></div><input type="text" id="cap" maxlength="100" placeholder="Tambahkan keterangan…" autocomplete="off"><div class="acts"><button data-a="x">Batal</button><button data-a="sendp">Kirim</button></div>')})}
  else if(t.id==='fs'){t.value='';shrink(f,900,0,function(d){if(d.length>680000)return toast('Foto terlalu besar.');S.simg=d;modal('<h2>Status foto</h2><div class="pc"><img src="'+d+'" alt="" style="max-width:100%;max-height:45vh;border-radius:8px"></div><input type="text" id="cap" maxlength="100" placeholder="Tambahkan keterangan…" autocomplete="off"><div class="acts"><button data-a="x">Batal</button><button data-a="posfoto">Posting</button></div>')})}
  else if(t.id==='ft'){t.value='';shrink(f,160,1,function(d){DB.upd(S.uid,{photo:d}).then(function(){S.me.photo=d;S.pf[S.uid]=S.me;renderAll();A.prof()}).catch(function(e){toast('Gagal menyimpan foto: '+(e.message||e))})})}});
A.sendp=function(){var c=($('cap').value||'').trim();closeM();sendMsg({img:S.pimg,body:c})};
A.zoom=function(a){var w=$('vw');clearTimeout(vt);w.dataset.a='vcl';w.style.background='#000';w.innerHTML='<img src="'+a.src+'" alt="">';w.classList.add('on')};
A.vcl=function(){$('vw').classList.remove('on')};
A.info=function(){var p=S.pf[S.cur];if(!p)return;modal('<div class="pc" data-a="pz">'+av(p,120)+'</div><h2 style="text-align:center;display:flex;justify-content:center;align-items:center;gap:6px">'+esc(p.name)+vb(p)+'</h2><p class="time" style="text-align:center">+'+esc(p.phone)+'</p><label>Info</label><div>'+esc(p.bio)+'</div><button class="lnk" style="color:#e53935" data-a="delchat">Hapus chat</button><div class="acts"><button data-a="x">Tutup</button></div>')};
A.pz=function(){var p=S.pf[S.cur];closeM();if(p&&p.photo){var w=$('vw');w.dataset.a='vcl';w.style.background='#000';w.innerHTML='<img src="'+p.photo+'" alt="Foto profil">';w.classList.add('on')}else toast('Belum ada foto profil.')};
A.delchat=function(){var id=S.cur;S.msgs.filter(function(m){return peerOf(m)===id}).forEach(function(m){S.hide[m.id]=1});saveLoc();closeM();A.back();toast('Chat dihapus')};
A.prof=function(){var m=S.me;modal('<h2>Profil</h2><div class="pc">'+av(m,110)+'<button class="send" style="position:absolute;right:calc(50% - 70px);bottom:0" data-a="foto" aria-label="Ganti foto">'+ic('cam')+'</button></div><input type="file" id="ft" accept="image/*" hidden><label>Nama</label><input type="text" id="pn" maxlength="25" value="'+esc(m.name).replace(/"/g,'&quot;')+'"><label>Info</label><input type="text" id="pb" maxlength="60" value="'+esc(m.bio).replace(/"/g,'&quot;')+'"><label>Nomor HP</label><div>+'+esc(m.phone)+vb(m)+'</div><div class="acts"><button data-a="x">Tutup</button><button data-a="psv">Simpan</button></div>')};
A.foto=function(){$('ft').click()};
A.psv=function(){var n=$('pn').value.trim(),b=$('pb').value.trim();if(!n)return toast('Nama wajib diisi.');DB.upd(S.uid,{name:n,bio:b}).then(function(){S.me.name=n;S.me.bio=b;S.pf[S.uid]=S.me;closeM();renderAll();toast('Profil disimpan')}).catch(function(e){toast('Gagal menyimpan: '+(e.message||e))})};
/* pilih dan hapus pesan */
function setSel(){var t=$('msgs').scrollTop;$('selb').classList.toggle('on',S.sel.length>0);$('selc').textContent=S.sel.length;renderMsgs();$('msgs').scrollTop=t}
var sb=document.createElement('div');sb.id='selb';sb.className='top selb';sb.innerHTML='<button class="ico" data-a="selx" aria-label="Batal">'+ic('back')+'</button><h1 id="selc">0</h1><button class="ico" data-a="seld" aria-label="Hapus pesan">'+ic('del')+'</button>';$('chat').appendChild(sb);
$('msgs').addEventListener('pointerdown',function(e){var b=e.target.closest('.b[data-id]');if(!b)return;clearTimeout(lpT);lpT=setTimeout(function(){lpT=0;lpF=1;setTimeout(function(){lpF=0},800);if(S.sel.indexOf(b.dataset.id)<0)S.sel.push(b.dataset.id);setSel()},450)});
['pointerup','pointercancel','scroll'].forEach(function(ev){$('msgs').addEventListener(ev,function(){clearTimeout(lpT);lpT=0;if(ev==='pointerup')setTimeout(function(){lpF=0},60)})});
$('msgs').addEventListener('contextmenu',function(e){if(e.target.closest('.b'))e.preventDefault()});
$('msgs').addEventListener('click',function(e){var b=e.target.closest('.b[data-id]');if(lpF){lpF=0;e.stopPropagation();e.preventDefault();return}if(!S.sel.length||!b)return;e.stopPropagation();var i=S.sel.indexOf(b.dataset.id);if(i<0)S.sel.push(b.dataset.id);else S.sel.splice(i,1);setSel()},true);
A.selx=function(){S.sel=[];setSel()};
A.seld=function(){var n=S.sel.length;if(!n)return;var p=S.pf[S.cur]||{},one=n===1&&S.msgs.some(function(m){return m.id===S.sel[0]&&m.sender_id!==S.uid});modal('<p style="font-size:16px;color:var(--sub)">'+(n===1?(one?'Hapus pesan dari '+esc(p.name)+'?':'Hapus pesan?'):'Hapus '+n+' pesan?')+'</p><div class="acts"><button data-a="x">Batal</button><button data-a="seld2">Hapus untuk saya</button></div>')};
A.seld2=function(){S.sel.forEach(function(i){S.hide[i]=1});S.sel=[];saveLoc();closeM();setSel();renderList()};
/* status */
A.newst=function(){modal('<h2>Buat status</h2><button class="mrow" data-a="sttxt"><span class="send">'+ic('pen')+'</span>Status teks</button><button class="mrow" data-a="stfoto"><span class="send">'+ic('cam')+'</span>Status foto</button><div class="acts"><button data-a="x">Batal</button></div>')};
A.sttxt=function(){stBg=BGS[0];modal('<h2>Status teks</h2><div class="stp" id="stp" style="background:'+stBg+'"><textarea id="stt" maxlength="200" placeholder="Ketik status"></textarea></div><div class="sw">'+BGS.map(function(c){return '<button data-a="bg" data-c="'+c+'" style="background:'+c+'" aria-label="Warna"></button>'}).join('')+'</div><div class="acts"><button data-a="x">Batal</button><button data-a="posst">Posting</button></div>')};
A.bg=function(a){stBg=a.dataset.c;$('stp').style.background=stBg};
function addSt(s){s.owner_id=S.uid;DB.post(s).then(function(r){S.sts.push(r);closeM();renderSt();toast('Status diposting')}).catch(function(e){toast('Gagal memposting: '+(e.message||e))})}
A.posst=function(){var t=$('stt').value.trim();if(!t)return toast('Tulis statusnya dulu.');addSt({kind:'t',txt:t,bg:stBg})};
A.stfoto=function(){$('fs').click()};
A.posfoto=function(){addSt({kind:'p',img:S.simg,txt:($('cap').value||'').trim()})};
function showSt(){clearTimeout(vt);var w=$('vw');if(vi>=vq.length){w.classList.remove('on');return}var s=vq[vi];w.dataset.a='vnx';w.style.background=s.kind==='t'?s.bg:'#000';
  w.innerHTML='<div class="pg">'+vq.map(function(x,i){return '<i class="'+(i<vi?'d':i===vi?'a':'')+'"></i>'}).join('')+'</div><div class="vh">'+av(vo,36)+'<div><b>'+esc(vo.name)+vb(vo)+'</b><div style="font-size:12px;opacity:.85">'+hm(s.created_at)+'</div></div></div>'+(s.kind==='t'?'<div class="vt">'+esc(s.txt)+'</div>':'<img src="'+s.img+'" alt=""><div class="vc">'+esc(s.txt)+'</div>');w.classList.add('on');vt=setTimeout(A.vnx,5000)}
A.vst=function(a){var id=a.dataset.id;vq=S.sts.filter(function(s){return s.owner_id===id});if(!vq.length)return;vi=0;vo=S.pf[id]||{name:'?'};showSt()};
A.vnx=function(){vi++;showSt()};
/* tekan lama chat di daftar = hapus chat */
$('list').addEventListener('contextmenu',function(e){var it=e.target.closest('.item[data-id]');if(!it)return;e.preventDefault();var id=it.dataset.id,p=S.pf[id]||{name:'?'};modal('<h2>'+esc(p.name)+'</h2><button class="lnk" style="color:#e53935" data-a="dchat" data-id="'+id+'">Hapus chat</button><div class="acts"><button data-a="x">Batal</button></div>')});
A.dchat=function(a){var id=a.dataset.id;S.msgs.filter(function(m){return peerOf(m)===id}).forEach(function(m){S.hide[m.id]=1});saveLoc();closeM();renderList();toast('Chat dihapus')};
document.addEventListener('click',function(e){var a=e.target.closest('[data-a]');if(a&&A[a.dataset.a])A[a.dataset.a](a)});
$('q').addEventListener('input',renderList);
$('txt').addEventListener('input',setSv);
$('txt').addEventListener('keydown',function(e){if(e.key==='Enter')sendT()});
$('bprof').innerHTML=ic('usr');$('bback').innerHTML=ic('back');$('batt').innerHTML=ic('img');$('brc').innerHTML=ic('del');$('brs').innerHTML=ic('send');$('fab').innerHTML=ic('plus');setSv();
boot();
})();
</script>
</body>
</html>
